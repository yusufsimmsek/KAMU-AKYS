# =================================================================
# Turist Bilgilendirme API - Spring Boot Configuration
# =================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Information
spring.application.name=turist-bilgilendirme-backend
info.app.name=Turist Bilgilendirme Backend API
info.app.description=Kamu AKYS Turist Bilgilendirme Sistemi
info.app.version=1.0.0

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/turistdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.gov.tr.kamu.turistbilgilendirme=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security Configuration
app.jwt.secret=VHVyaXN0QmlsaWdlbGRpcm1lS2FtdUFLWVNQZXJTZWN1cmV0S2V5MjAyNFNwcmluZ0Jvb3RKd3RTZWN1cml0eU1pbmltdW0yNTZCaXRLZXk=
app.jwt.expiration=604800000
app.jwt.refresh-expiration=2592000000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Validation Configuration
spring.validation.add-primary-type-filter=false

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false 